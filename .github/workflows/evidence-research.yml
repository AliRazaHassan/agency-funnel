name: Evidence research validation
on:
  push:
    branches: [codex/evidence-research-portal]
  pull_request:
    paths: ['product-hunter/**', '.github/workflows/evidence-research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product-hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-hunter/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-research-results
          path: product-hunter/test-results
          if-no-files-found: ignore
