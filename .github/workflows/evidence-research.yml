name: Evidence research validation
on:
  push:
    branches: [codex/evidence-research-portal]
  pull_request:
    paths: ['product-hunter/**', '.github/workflows/evidence-research.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: product-hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-hunter/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test tests/integration/*.test.js
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:regression
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-research-results
          path: product-hunter/test-results
          if-no-files-found: ignore
