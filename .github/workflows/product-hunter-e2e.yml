name: Product Hunter E2E

on:
  push:
    branches: [main]
    paths:
      - "product-hunter/**"
      - ".github/workflows/product-hunter-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "product-hunter/**"
      - ".github/workflows/product-hunter-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-hunter/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
        env:
          PRODUCT_IMAGE_LOOKUP_LIMIT: "0"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: product-hunter-playwright-artifacts
          path: |
            product-hunter/playwright-report
            product-hunter/test-results
          if-no-files-found: ignore
